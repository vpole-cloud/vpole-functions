name: Publish NuGet packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: NuGet package version, for example 0.1.0-preview.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve package version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${INPUT_VERSION:-$REF_NAME}"
          version="${version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package version: $version" >&2
            exit 1
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore Pole.Functions.slnx --locked-mode

      - name: Build
        run: >-
          dotnet build Pole.Functions.slnx
          --configuration Release
          --no-restore
          -p:Version=${{ env.PACKAGE_VERSION }}

      - name: Test
        run: dotnet test Pole.Functions.slnx --configuration Release --no-build

      - name: Pack
        run: |
          dotnet pack src/Pole.Functions.Protocol \
            --configuration Release \
            --no-build \
            --output artifacts \
            -p:Version=${{ env.PACKAGE_VERSION }}
          dotnet pack src/Pole.Functions.Sdk \
            --configuration Release \
            --no-build \
            --output artifacts \
            -p:Version=${{ env.PACKAGE_VERSION }}

      - name: Authenticate to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish
        run: >-
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
